name: Desktop build

# Desktop artifacts are built on their own operating system.
#
# Cross-building a Windows installer from Linux needs Wine and a 32-bit
# loader for the NSIS stub, and the result is signed by nothing and tested on
# nothing. Each runner here produces the artifact natively, which is both
# simpler and the only way the installer is ever actually executed before a
# user does it.
on:
  # workflow_dispatch only appears once this file is on the default branch.
  # Until then, a push that touches the desktop build is what runs it.
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    branches:
      - 'claude/**'
    paths:
      - 'cecc/apps/desktop/**'
      - 'cecc/scripts/**'
      - 'cecc/apps/dashboard/**'
      - 'cecc/packages/**'
      - '.github/workflows/desktop.yml'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: desktop:win
            artifact: cecc-windows
          - os: macos-latest
            target: desktop:mac
            artifact: cecc-macos
          - os: ubuntu-latest
            target: desktop:linux
            artifact: cecc-linux

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cecc

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # node:sqlite needs 22.5+; the desktop build runs it under Electron's
          # own Node, but the test and build steps run it here.
          node-version: '22'
          cache: npm
          cache-dependency-path: cecc/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build desktop artifacts
        run: npm run ${{ matrix.target }}
        env:
          # Unsigned builds. Signing needs certificates this workflow does not
          # have, and pretending otherwise would produce an installer that
          # claims a publisher it cannot prove.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          path: |
            cecc/apps/desktop/release/*.exe
            cecc/apps/desktop/release/*.zip
            cecc/apps/desktop/release/*.dmg
            cecc/apps/desktop/release/*.AppImage
            cecc/apps/desktop/release/*.tar.gz
